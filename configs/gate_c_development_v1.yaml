version: 1
experiment: gate_c_development_v1
mode: development_only_not_confirmatory

source:
  trajectories: outputs/gate_a/pilot_v1/trajectories.jsonl
  trajectories_sha256: 5811f97574707e9257dcb5c21669bdc394040438cf827761d6c43637ebd90526
  trajectory_outcomes: outputs/gate_a/pilot_v1/analysis/trajectory_outcomes.csv
  trajectory_outcomes_sha256: 2e4024d2347f2c7240992c53b98cf415c0eba25c1400f8d3195cece329c594e9
  gate_a_summary: outputs/gate_a/pilot_v1/analysis/summary.json
  gate_a_summary_sha256: c0fd3ca7ec748196b664fc0a241b68d7058e71c18022d1a6c93a144a051b8d3c
  expected_trajectories: 240
  expected_turns_per_trajectory: 25
  gate_a_threshold: 3.5

scope:
  positive_axis: cautious_risk_seeking
  negative_control_axis: independent_sycophantic
  topic_splits:
    public_library_service: train
    water_conservation_campaign: validation
    emergency_supply_network: development_test

labels:
  primary_horizon: 5
  sensitivity_horizons: [3, 10]
  total_turns: 25
  exclude_at_or_after_onset: true

features:
  reference_layer: 20
  slope_window: 3
  activation:
    - projection_layer20
    - projection_delta_turn1
    - projection_slope_last3
    - norm_layer20
    - turn
  forbidden:
    - response_projection
    - current_response_text
    - condition
    - future_probe
  text_prefix_includes_system: false

text_encoder:
  name: intfloat/e5-base-v2
  revision: f52bf8ec8c7124536f0efb74aca902b2995e5bcd
  input_prefix: "query: "
  pooling: attention_mask_average
  normalize: true
  max_length: 512
  truncation_side: left
  batch_size: 64
  dtype: bfloat16

analysis:
  learner: class_weighted_l2_logistic_regression
  c_grid: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  tfidf:
    ngram_range: [1, 2]
    min_df: 2
    max_features: 50000
    sublinear_tf: true
  validation_min_recall: 0.80
  bootstrap_samples: 10000
  bootstrap_seed: 20260910
  primary_metric: incremental_auprc_text_plus_activation_minus_text

output:
  root: outputs/gate_c/development_v1
  dataset: outputs/gate_c/development_v1/dataset/examples.jsonl
  dataset_summary: outputs/gate_c/development_v1/dataset/summary.json
  embeddings: outputs/gate_c/development_v1/embeddings/e5_base_v2.npz
  embeddings_summary: outputs/gate_c/development_v1/embeddings/summary.json
  analysis_dir: outputs/gate_c/development_v1/analysis
