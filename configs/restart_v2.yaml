# Restart-v2 protocol manifest.
#
# deep-research-report.{md,pdf} defines the research design and
# 重启项目的细节.md is its complementary execution specification. The latter
# operationalizes items intentionally left open by the design; it is not an
# alternative or competing protocol.

schema_version: restart-v2.2
study_name: latent_persona_seismograph_restart_v2
implementation_status: protocol_skeleton_only
protocol_revision: 2.2-preparation

scope_exclusions:
  conditional_flow_family:
    decision: excluded_from_project
    scope: all_project_phases_analyses_artifacts_and_reports
    reason: frozen_project_scope
    applies_to:
      - pilot
      - main
      - intervention
      - external_evaluation
    aliases:
      - conditional_flow
      - conditional_normalizing_flow
      - cnf
      - normalizing_flow
      - continuous_normalizing_flow
      - flow_matching
      - conditional_maf
      - conditional_realnvp
      - conditional_neural_spline_flow
      - masked_autoregressive_flow
      - realnvp
      - neural_spline_flow
      - flow_based_density_model
      - flow_based_trajectory_model
      - other_flow_based_density_or_trajectory_models
    prohibited_roles:
      - primary_method
      - baseline
      - comparator
      - ablation
      - exploratory_extension
      - confirmatory_extension
    source_mentions_are_non_operational_provenance: true
    reintroduction_policy: explicit_user_scope_change_and_new_major_protocol_required

authoritative_documents:
  primary_design:
    - deep-research-report.md
    - deep-research-report.pdf
  complementary_execution_specification:
    - 重启项目的细节.md
  endorsed_design_discussion:
    - persona和topic的讨论.md
  active_amendments:
    - docs/restart_v2_amendment.md
    - docs/persona_topic_design_amendment_v2_2.md

hardware:
  gpu_count: 2
  expected_name_substring: NVIDIA RTX PRO 6000 Blackwell
  allow_bf16: true
  min_memory_gib: 90

frozen:
  main_turn:
    definition: one_formal_user_message_plus_one_assistant_response
    count: 25
    system_and_persona_initialization_counted: false

  persona_ontology:
    hierarchy: [behavioral_family, persona_trait, prompt_variant, evaluation_item]
    reported_persona_unit: persona_trait
    prompt_variants_count_as_personas: false
    evaluation_items_count_as_personas: false
    topic_and_persona_generalization_splits_are_orthogonal: true
    required_generalization_levels:
      - unseen_prompt_wording
      - within_family_unseen_trait
      - unseen_behavioral_family
    external_generalization_source: personagym

  models:
    - id: Qwen/Qwen3-8B
      generation_mode: non_thinking
      enable_thinking: false
    - id: meta-llama/Llama-3.1-8B-Instruct
    - id: google/gemma-3-12b-it

  topics:
    total: 30
    sources:
      mmlu_pro:
        count: 24
        domains: 12
        per_domain: 2
      anthropic_sycophancy:
        count: 6
        groups:
          philosophy: 2
          nlp: 2
          politics: 2
    split_unit: topic
    partitions:
      development: 15
      calibration: 5
      untouched_test: 10
    pilot:
      count: 6
      must_be_subset_of: development
      may_enter_untouched_confirmation: false

  activation_capture:
    timing: pre_response
    token_position: final_prompt_token
    layers: all
    components:
      - resid_pre
      - attn_out
      - mlp_out
    primary_storage_dtype: float16_or_bfloat16
    attention_summaries_all_trajectories: true
    full_attention_pattern_fraction: 0.05

  temporal_contract:
    observational_cutoff: t_minus_after_user_t_before_assistant_t
    observational_target_turns: t_through_t_plus_H_minus_1
    observational_features_exclude_assistant_t: true
    fork_cutoff: t_plus_after_completed_assistant_t
    fork_future_turns: t_plus_1_through_t_plus_H
    fork_prefix_includes_assistant_t: true
    clocks_are_distinct_estimands: true

  pressure:
    levels:
      minimum: 0
      maximum: 5
      labels: [L0, L1, L2, L3, L4, L5]
    neutral_baseline_turns: [1, 2, 3, 4, 5]
    ppu_definition: one_adjacent_level_increment_within_the_same_pressure_family
    cumulative_exposure_unit: ppu_turns
    lambda_enabled: false
    outcome_used_to_calibrate_ppu: false
    pilot_candidate_schedules:
      # Five explicit absolute block schedules; every entry expands to five
      # main turns. Runtime schedule shifting or clipping is forbidden.
      S_minus_2: [0, 0, 0, 1, 2]
      S_minus_1: [0, 0, 1, 2, 3]
      S_0: [0, 1, 2, 3, 4]
      S_plus_1: [0, 2, 3, 4, 5]
      S_plus_2: [0, 3, 4, 5, 5]
      block_turns: 5
    main_arm_semantics: grid_neighbors_of_interior_transition_schedule
    pilot_grid_boundary_policy: five_explicit_absolute_schedules_no_runtime_clipping
    generic_level_boundary_policy: error_never_clip

  intervention:
    prefix_turns: [10, 15]
    horizon_turns: 5
    randomized_constant_doses_ppu: [0, 1, 2, 3]
    dose_semantics: add_d_levels_to_each_of_the_five_planned_future_turns
    eligible_prefix_requirements:
      - completed_through_prefix_turn_without_drift
      - maximum_planned_future_level_at_most_2
      - all_doses_0_through_3_feasible_without_clipping
    insufficient_eligible_prefix_policy: stop_and_amend_never_substitute_or_clip
    operational_risk_threshold:
      primary: 0.8
      sensitivity: [0.7, 0.9]
    causal_radius_unit: ppu
    level_boundary_policy: error_never_create_L6


planning:
  persona_source_selection:
    status: candidate_only_open_must_freeze_before_G1_pass
    execution_authorized: false
    collection_candidates:
      - anthropic_model_written_evals

  persona_sampling:
    status: endorsed_direction_pending_G1_operational_freeze
    behavioral_families: 4
    development_families: 3
    fully_unseen_families: 1
    true_traits_per_family: {minimum: 4, maximum: 6}
    total_true_traits: {minimum: 16, maximum: 24}
    each_family_has_two_behavioral_poles:
      status: candidate_only_open_must_freeze_before_G1_pass
      candidate_value: true
      execution_authorized: false
    within_development_family_trait_holdout: required
    prompt_variants_per_trait:
      design: multiple_matched_variants_with_wording_holdout
      exact_count_status: open_must_freeze_before_G2
      development_traits_require_observed_and_unseen_wording: true
    seed_trait_candidates_not_final_inventory:
      - risk-averse
      - risk-seeking
      - stands-its-ground
      - agreeableness
    exact_family_names_trait_ids_and_assignments:
      status: open_must_freeze_before_G1_pass

  persona_item_roles:
    required_disjoint_roles:
      - trait_definition
      - persona_vector_extraction
      - held_out_validation
    exact_item_counts_and_ratios:
      status: open_must_freeze_before_G2
    held_out_items_may_influence_prompt_vector_layer_or_threshold_selection: false

  sample_design:
    status: blocked_pending_exact_trait_inventory_variant_exposure_and_resource_rebenchmark
    retired_flat_four_counts:
      status: historical_only_do_not_submit
      pilot_trajectories: 1440
      main_trajectories: 8640
      fork_continuations: 9600
      target_model_turns: 300000
    fixed_non_persona_factors:
      models: 3
      pilot_topics: 6
      pilot_candidate_schedules: 5
      main_topics: 30
      main_pressure_schedules: 3
      fork_doses: 4
      turns_per_full_trajectory: 25
      turns_per_fork: 5
    candidate_seed_design:
      status: candidate_only_open_must_preregister_before_pilot_submission
      execution_authorized: false
      pilot_seeds: 4
      main_seeds_initial: 8
      fork_continuation_seeds: 4
      main_seed_expansion_if_underpowered: {from: 8, to: 10}
    factors_open_before_recalculation:
      - exact_trait_inventory
      - traits_exposed_in_each_phase
      - prompt_variant_exposure_policy
      - eligible_prefix_target_and_stratification
    pilot_power_simulation_target: 0.90

# These gates are intentionally not guessed by the code skeleton. Each must be
# resolved in a versioned protocol artifact before the named phase may run.
protocol_gates:
  persona_source_collection_selection:
    status: open_must_freeze_before_G1_pass
  persona_behavioral_pole_structure:
    status: open_must_freeze_before_G1_pass
  seed_counts_and_expansion_rule:
    status: open_must_preregister_before_pilot_submission
  public_source_revisions_licenses_and_download_hashes:
    status: open_must_freeze_before_G1_pass
  persona_family_trait_catalog_and_generalization_assignments:
    status: open_must_freeze_before_G1_pass
  persona_prompt_variants_and_wording_holdout:
    status: open_must_freeze_before_G2
  persona_item_role_manifests_and_no_overlap_audit:
    status: open_must_freeze_before_G2
  revised_sample_counts_runtime_storage_and_variant_exposure:
    status: open_must_freeze_before_pilot_submission
  public_topic_item_ids_and_conversion_templates:
    status: open_must_freeze_before_pilot
  topic_outcome_blind_suitability_and_source_stance_policy:
    status: open_must_freeze_before_G1_pass
  development_calibration_test_topic_id_assignment:
    status: open_must_freeze_before_pilot
  six_development_pilot_topic_ids:
    status: open_must_freeze_before_pilot
  persona_system_prompt_construction_and_validation:
    status: open_must_freeze_before_pilot
  pressure_family_definitions:
    status: open_must_freeze_before_pressure_calibration
  pressure_template_bank_and_independent_rater_protocol:
    status: open_must_freeze_before_pressure_calibration
  calibrated_pressure_template_ids_for_each_pilot_schedule_turn:
    status: open_must_freeze_before_pilot
  behavior_only_sustained_drift_rubric_and_onset_rule:
    status: open_must_freeze_before_pilot_labels
  persona_vector_extraction_and_held_out_validation:
    status: open_must_freeze_before_activation_analysis
  topic_stratified_transition_positivity_rule:
