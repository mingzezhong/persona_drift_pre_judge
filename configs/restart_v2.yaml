  persona_source_collection_selection:
    status: open_must_freeze_before_G1_pass
  persona_behavioral_pole_structure:
    status: open_must_freeze_before_G1_pass
  seed_counts_and_expansion_rule:
    status: open_must_preregister_before_pilot_submission
  public_source_revisions_licenses_and_download_hashes:
    status: open_must_freeze_before_G1_pass
  persona_family_trait_catalog:
    status: open_must_freeze_before_G1_pass
  persona_generalization_assignments:
    status: open_must_freeze_before_G2_pass
  persona_prompt_variants_and_wording_holdout:
    status: open_must_freeze_before_G2
  persona_item_role_manifests_and_no_overlap_audit:
    status: open_must_freeze_before_G2
  revised_sample_counts_runtime_storage_and_variant_exposure:
    status: open_must_freeze_before_pilot_submission
  public_topic_item_ids_and_conversion_templates:
    status: open_must_freeze_before_G1_pass
  topic_scenario_family_ids_subtypes_and_target_family_assignments:
    status: open_must_freeze_before_G1_pass
  topic_suitability_scale_aggregation_raters_ties_and_threshold:
    status: open_must_freeze_before_G1_pass
  public_source_candidate_groups_revisions_items_and_manifest_hashes:
    status: open_must_freeze_before_G1_pass
  topic_scenario_manifests_with_25_moves_and_pressure_slots:
    status: open_must_freeze_before_G1_pass
  topic_scope_by_behavioral_family_eligibility_matrix:
    status: open_must_freeze_before_G1_pass
  persona_trait_variant_holdout_assignments:
    status: open_must_freeze_before_G2_pass
  phase_specific_X_phi_exposure_signed_manifests:
    status: open_must_freeze_before_each_outcome_phase
  topic_outcome_blind_suitability_and_source_stance_policy:
    status: open_must_freeze_before_G1_pass
  development_calibration_test_topic_id_assignment:
    status: open_must_freeze_before_G1_pass
  six_development_pilot_topic_ids:
    status: open_must_freeze_before_G1_pass
  heldout_family_schedule_transfer_or_fallback_rule:
    status: open_must_freeze_before_G6_main_outcome_reveal
  persona_system_prompt_construction_and_validation:
    status: open_must_freeze_before_pilot
  pressure_family_definitions:
    status: open_must_freeze_before_pressure_calibration
  pressure_template_bank_and_independent_rater_protocol:
    status: open_must_freeze_before_pressure_calibration
  calibrated_pressure_template_ids_for_each_pilot_schedule_turn:
    status: open_must_freeze_before_pilot
  behavior_only_sustained_drift_rubric_and_onset_rule:
