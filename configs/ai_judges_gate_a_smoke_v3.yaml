version: 3
purpose: >-
  Independent output-based persona-consistency review of isolated Gate A probes.
  Condition, checkpoint, history, and system prompt are hidden from the judges.

input:
  manifest: outputs/gate_a/smoke_v3/probes.jsonl
  rubric: configs/extraction_judge_rubric_v2.yaml

inference:
  dtype: bfloat16
  device_map: auto
  attention_implementation: eager
  max_new_tokens: 256
  max_retries: 1

judges:
  judge_a:
    reviewer_id: reviewer_a
    review_sheet: outputs/gate_a/smoke_v3/review/reviewer_a.csv
    model: mistralai/Mistral-Small-24B-Instruct-2501
    revision: 9527884be6e5616bdd54de542f9ae13384489724
    tokenizer_kwargs:
      fix_mistral_regex: true
    output: outputs/gate_a/smoke_v3/ai_review/judge_a_mistral.jsonl
  judge_b:
    reviewer_id: reviewer_b
    review_sheet: outputs/gate_a/smoke_v3/review/reviewer_b.csv
    model: microsoft/phi-4
    revision: 2db69c1c3e91a05d2c64a3185acfbaf36f744e25
    output: outputs/gate_a/smoke_v3/ai_review/judge_b_phi4.jsonl

consensus:
  rule: all_reviewers_must_accept
  disagreement_action: reject_and_flag
  reviewed_manifest: outputs/gate_a/smoke_v3/ai_review/reviewed_probes.jsonl
  summary: outputs/gate_a/smoke_v3/ai_review/consensus_summary.json
