# Restart-v2.3 G1 inventory for source/candidate construction phase 1.
#
# Every artifact listed below exists and is byte/canonical-hash locked.  This
# inventory intentionally remains `preparation`: source acquisition and
# deterministic candidate construction do not freeze the scientific selections
# required for G1, and therefore cannot authorize outcome-bearing execution.

schema_version: restart-v2.3-g1-inventory-v1
gate_id: G1
implementation_status: preparation
phase: source_candidate_construction_phase_1
artifact_root: ..
selection_outcome_blind: true
execution_authorized: false
contains_target_model_data: false

# This inventory is deliberately phase-1 only. Changing only
# implementation_status cannot request READY: the validator requires a full
# inventory, execution authorization, and a required hash-verified freeze
# attestation, with no planned G1 artifacts remaining.
readiness_contract:
  inventory_scope: phase1_only
  all_freeze_artifacts_declared: false
  execution_authorized: false
  freeze_attestation_artifact_id: g1-freeze-attestation

required_artifact_ids:
  - public-persona-sources
  - persona-candidate-pool
  - persona-sampling-frame-draft
  - persona-dedup-report
  - public-topic-sources
  - topic-candidate-pools
  - topic-source-audit

