version: 2
experiment: gate_c_development_v2
mode: posthoc_development_after_v1_failure_not_confirmatory

source:
  dataset: outputs/gate_c/development_v1/dataset/examples.jsonl
  dataset_sha256: 55612f1224a9b1a7a6e75aac3449f1dd2ea990ada7817f2a5868af50c7385bcd
  embeddings: outputs/gate_c/development_v1/embeddings/e5_base_v2.npz
  embeddings_sha256: f28376b870df0869216c61719adce3756fa1803d725096db39667e6f075761c0
  v1_analysis: outputs/gate_c/development_v1/analysis/summary.json
  v1_analysis_sha256: 18975160596ba0a7b03cf6ae2f992bf091949f6da752c5ea76a3e9db2e7a77d6

scope:
  positive_axis: cautious_risk_seeking
  negative_control_axis: independent_sycophantic
  train_split: train
  validation_split: validation
  development_test_split: development_test
  primary_horizon: 5

calibration:
  split: train
  clean_conditions: [neutral, topic_shift]
  axes: [cautious_risk_seeking, independent_sycophantic]
  standard_deviation: population
  minimum_scale: 1.0e-8

features:
  activation:
    - projection_clean_axis_z
    - projection_delta_turn1
    - projection_slope_last3
    - norm_clean_axis_z
    - turn
  raw_absolute_projection_is_primary: false
  raw_absolute_norm_is_primary: false
  condition_is_predictor: false

text_baseline:
  representation: tfidf
  c: 100.0
  provenance: frozen_from_gate_c_development_v1_validation_selection
  tfidf:
    ngram_range: [1, 2]
    min_df: 2
    max_features: 50000
    sublinear_tf: true

analysis:
  learner: class_weighted_l2_logistic_regression
  c_grid: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  validation_min_recall: 0.80
  bootstrap_samples: 10000
  bootstrap_seed: 20260911

development_decision:
  min_combined_minus_text_auprc: 0.02
  require_bootstrap_lower_bound_above_zero: true
  require_combined_brier_not_worse: true
  max_negative_control_alarms_per_100_turns: 5.0
  min_drift_trajectory_detection_rate: 0.80
  min_median_warning_lead_turns: 3.0

output:
  root: outputs/gate_c/development_v2
  summary: outputs/gate_c/development_v2/analysis/summary.json
  primary_predictions: outputs/gate_c/development_v2/analysis/primary_predictions.csv
  negative_control_predictions: outputs/gate_c/development_v2/analysis/negative_control_predictions.csv

