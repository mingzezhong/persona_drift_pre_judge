version: 2
experiment: representation_gate_b_pilot_v2

data:
  template: data/templates/persona_gate_b.yaml
  output_dir: outputs/gate_b/representation_pilot_v2
  seeds: [1, 2]
  validation_split: validation
  test_split: test

model:
  config: configs/gate_b_generation_v2.yaml
  name: Qwen/Qwen2.5-7B-Instruct
  revision: a09a35458c702b33eeacc393d103063234e8bc28

vectors:
  path: outputs/persona_vectors/quality_pilot_s0_v4/persona_vectors.pt
  sha256: 54c144edd24bf07ad648b4df52c0c319bb531aebe315f8bf450c58edacf0347b
  representation: response_token_mean
  projection: cosine
  reference_layer: 20

selection:
  rule: >-
    Maximize mean validation AUROC across both axes, then mean validation paired
    direction accuracy, then choose the layer closest to reference layer 20.

bootstrap:
  samples: 2000
  seed: 20260809
  unit: prompt_axis_seed_pair

gate:
  min_mean_test_auroc: 0.80
  min_each_axis_test_auroc: 0.75
  min_each_axis_test_pair_accuracy: 0.75

outputs:
  projection_dir: outputs/gate_b/representation_pilot_v2/projection
