[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-drift-pre-judge"
version = "0.1.0"
description = "Prospective activation-based forecasting of persona drift"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.33,<2",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "pyarrow>=14,<22",
  "pyyaml>=6,<7",
  "scikit-learn>=1.3,<2",
  "transformers>=4.46,<5",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

