[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-drift-pre-judge"
version = "0.2.0"
description = "Pressure-conditioned latent-trajectory forecasting of LLM persona drift"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.1,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<23",
  "pyyaml>=6,<7",
  "safetensors>=0.5,<1",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "torch>=2.9,<3",
  "transformers>=4.57,<5",
  "zarr>=3,<4",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.9,<4",
  "statsmodels>=0.14,<1",
]
data = ["datasets>=3,<5"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
